apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: conference-app
data:
  DATABASE_URL: "postgresql://conference_user:conference_pass@postgres-service:5432/conference_db"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: conference-app
data:
  REACT_APP_API_URL: "http://backend-service:8000"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: conference-app
data:
  GF_USERS_ALLOW_SIGN_UP: "false"