apiVersion: v1
kind: ConfigMap
metadata:
  name: conference-config
  namespace: conference-app
data:
  # Database configuration
  POSTGRES_DB: "conference_db"
  POSTGRES_USER: "conference_user"
  DATABASE_URL: "postgresql://conference_user:conference_pass@postgres-service:5432/conference_db"
  
  # Frontend configuration
  REACT_APP_API_URL: "http://backend-service:8000"
  
  # Grafana configuration
  GF_USERS_ALLOW_SIGN_UP: "false"
  
  # PostgreSQL Exporter configuration
  DATA_SOURCE_NAME: "postgresql://conference_user:conference_pass@postgres-service:5432/conference_db?sslmode=disable"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: conference-app
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      # - "first_rules.yml"
      # - "second_rules.yml"

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'fastapi-app'
        static_configs:
          - targets: ['backend-service:8000']
        metrics_path: '/metrics'
        scrape_interval: 5s

      - job_name: 'postgres-exporter'
        static_configs:
          - targets: ['postgres-exporter-service:9187']
        scrape_interval: 5s