groups:
  - name: conference_api_alerts
    rules:
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }} errors per second"

      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High response time detected"
          description: "95th percentile response time is {{ $value }} seconds"

      - alert: ServiceDown
        expr: up{job="conference-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Conference API service is down"
          description: "The conference backend service has been down for more than 1 minute"

      - alert: DatabaseOperationSlow
        expr: histogram_quantile(0.95, rate(database_operations_duration_seconds_bucket[5m])) > 0.5
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Slow database operations detected"
          description: "95th percentile database operation time is {{ $value }} seconds"